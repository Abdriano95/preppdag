<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Inköpslista, recept och veckoplan för matlådorna">
<meta name="theme-color" content="#EEF2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Preppdag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: matlådelock. Sticky rad med tre färgkodade lock (A/B/C) överst, kvittolik lista i mitten, flikrad inom tumavstånd längst ner. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E2E8E3; --ink:#17201B; --muted:#56655E; --line:#D3DCD5;
  --a:#966400; --b:#2D6E44; --c:#B03A26; --on-accent:#FFFFFF;
  --accent:var(--a);
  --font-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --surface:#161D19; --sunk:#1F2823; --ink:#E5ECE7; --muted:#95A49C; --line:#29342E;
    --a:#E2AB42; --b:#74BF88; --c:#F08169; --on-accent:#0E1311; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161D19; --sunk:#1F2823; --ink:#E5ECE7; --muted:#95A49C; --line:#29342E;
  --a:#E2AB42; --b:#74BF88; --c:#F08169; --on-accent:#0E1311; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, var(--surface));
}
body[data-combo="B"]{--accent:var(--b)}
body[data-combo="C"]{--accent:var(--c)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto;padding-inline:16px}

/* Topp */
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding-block:14px 2px}
.brand{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.brand i{display:block;width:14px;height:6px;border-radius:2px;background:var(--accent)}
.when{font-size:13px;color:var(--muted)}
.when.today{color:var(--accent);font-weight:700}

/* Locken */
.lidbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.lids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-block:14px 12px}
.lid{
  position:relative;appearance:none;-webkit-appearance:none;cursor:pointer;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:9px 10px 10px;display:grid;gap:3px;min-width:0;
}
.lid::before{content:"";position:absolute;top:-4px;left:12px;width:26px;height:7px;border-radius:3px;background:var(--lid)}
.lid .letter{font-family:var(--font-display);font-weight:800;font-size:27px;line-height:1;color:var(--lid)}
.lid .dishes{font-size:12px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.lid[aria-pressed="true"]{border-color:var(--lid);background:color-mix(in srgb, var(--lid) 12%, var(--surface));box-shadow:inset 0 -3px 0 var(--lid)}
.lid[aria-pressed="true"] .dishes{color:var(--ink)}

main{padding-block:18px 96px}
.view{display:grid;gap:16px}

/* Typ */
.eyebrow,.h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0}
.h1{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.h2{font-family:var(--font-display);font-weight:800;font-size:23px;line-height:1.12;letter-spacing:-.012em;margin:0;text-wrap:balance}
.sub,.lead{color:var(--muted);margin:6px 0 0}
.lead{font-size:16px;max-width:62ch}
.hint{font-size:13px;color:var(--muted);margin:0}
.meta{font-family:var(--font-mono);font-size:12px;color:var(--muted)}

/* Progress */
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .25s ease}

/* Lista */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:13px 14px 9px}
.group-note{font-size:13px;color:var(--muted);padding:0 14px 10px;margin:-4px 0 0}
.item{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:54px}
.item input,.switch-row input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.box{width:26px;height:26px;border-radius:8px;border:2px solid color-mix(in srgb, var(--muted) 55%, var(--line));display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;fill:none;stroke:var(--on-accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.item input:checked + .box{background:var(--accent);border-color:var(--accent)}
.item input:checked + .box svg{opacity:1;transform:none}
.item input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.item input:checked ~ .txt .name{text-decoration:line-through;color:var(--muted)}
.item input:checked ~ .txt .alt,.item input:checked ~ .txt .tags{opacity:.6}
.item input:checked ~ .amt{color:var(--muted)}
.txt{min-width:0;padding-top:1px}
.name{font-weight:700;line-height:1.3}
.alt{display:block;font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.tags{display:block;font-size:12px;color:var(--accent);font-weight:700;margin-top:4px;letter-spacing:.01em}
.amt{font-family:var(--font-mono);font-size:14px;text-align:right;padding-top:2px;max-width:9.5em;font-variant-numeric:tabular-nums;line-height:1.3}

/* Sötsug-panel i listan */
.extras{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.extras summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;min-height:54px}
.extras summary::-webkit-details-marker{display:none}
.extras summary svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.extras[open] summary svg{transform:rotate(180deg)}
.extras-body{display:grid;border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.srow + .srow{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{appearance:none;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:2ch;text-align:center;font-family:var(--font-mono);font-size:17px}
.switch-row{position:relative;cursor:pointer}
.track{flex:none;width:50px;height:30px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.switch-row input:checked + .track{background:var(--accent);border-color:var(--accent)}
.switch-row input:checked + .track::after{transform:translateX(20px)}
.switch-row input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* Egna varor */
.add-form{display:grid;gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.fl{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:5px}
.field{display:block;width:100%;min-width:0;min-height:46px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.field:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.add-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px}
.add-weekly{display:flex;align-items:center;justify-content:space-between;gap:12px}
.item-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;border-top:1px solid var(--line)}
.item-wrap .item{border-top:0;padding-right:4px}
.del{appearance:none;border:0;background:transparent;color:var(--muted);width:44px;height:44px;margin:5px 6px 0 0;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.del:hover{background:var(--sunk);color:var(--ink)}
.del svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.toast button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;margin-left:12px;padding:4px 2px;cursor:pointer}

/* Knappar */
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{appearance:none;cursor:pointer;font-weight:700;font-size:15px;line-height:1.2;border-radius:12px;padding:12px 14px;min-height:50px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.armed{border-color:var(--c);color:var(--c)}
.link{appearance:none;background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px;font-family:var(--font-body);font-size:12px}
.pill{appearance:none;cursor:pointer;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pill[aria-pressed="true"] i{background:var(--accent)}
.copybox{display:grid;gap:8px}
.copybox textarea{width:100%;font-family:var(--font-mono);font-size:16px;line-height:1.4;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}

/* Recept */
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rhead > div{min-width:0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--sunk);padding:4px;border-radius:14px}
.seg button{appearance:none;border:0;background:transparent;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:1px;min-width:0;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.seg-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.seg button[aria-selected="true"] .seg-k{color:var(--accent)}
.seg-n{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:grid;gap:18px;min-width:0}
.card-h{display:grid;gap:8px}
.block{display:grid;gap:8px}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:12px;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.ing{list-style:none;margin:0;padding:0;display:grid}
.ing li{display:grid;grid-template-columns:5.8em minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.ing li:first-child{border-top:0}
.ing .ia{font-family:var(--font-mono);font-size:13px;color:var(--accent);padding-top:2px;font-variant-numeric:tabular-nums}
.ing li.ing-g{display:block;border-top:0;padding:14px 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.ing li.ing-g + li{border-top:0}
.steps{list-style:none;margin:0 -8px;padding:0;display:grid;gap:2px}
.step{appearance:none;width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:10px 8px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;cursor:pointer}
.step:active{background:var(--accent-soft)}
.num{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;transition:background .15s}
.num svg{width:14px;height:14px;fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.step.is-done .num{background:var(--accent)}
.step.is-done .stxt{color:var(--muted)}
.stxt{padding-top:3px}
.stxt b{font-weight:700}
.tip{margin:0;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}

/* Sötsug */
.intro{display:grid;gap:2px}
.swaps{margin:0;display:grid}
.swap{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.swap:first-child{border-top:0;padding-top:0}
.swap dt{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;font-weight:700}
.swap dt s{color:var(--muted);font-weight:400}
.swap dt span{color:var(--accent)}
.swap dd{margin:0;color:var(--muted);font-size:15px}
.why{margin:0;font-size:15px;border-left:3px solid var(--accent);padding:2px 0 2px 12px}

/* Veckan */
.timeline{display:grid}
.tl{display:grid;grid-template-columns:6.6em minmax(0,1fr);gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0;padding-top:0}
.tl-when{font-family:var(--font-mono);font-size:13px;color:var(--accent);padding-top:2px}
.tl-t{font-weight:700}
.tl p{margin:2px 0 0;color:var(--muted);font-size:15px}
.rot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rot-i{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:3px;align-content:start;min-width:0}
.rot-i .letter{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1;color:var(--lid)}
.rot-w{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.rot-d{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.rot-i.is-now{border-color:var(--lid);background:color-mix(in srgb, var(--lid) 12%, var(--surface))}
.rot-i.is-now .rot-d{color:var(--ink)}
.now{font-size:11px;font-weight:700;color:var(--lid)}
.day{margin:0;display:grid}
.day-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.day-r:first-child{border-top:0;padding-top:0}
.day-r dt{font-weight:700;min-width:0}
.day-r dt span{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:1px}
.day-r dd{margin:0;font-family:var(--font-mono);font-size:14px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.day-r.sum{border-top:2px solid var(--ink);padding-top:12px}
.day-r.sum dt{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.2}
.day-r.sum dd{font-size:17px;color:var(--accent)}
.day-r.sum dd span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* Flikrad */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-inline:8px}
.tab{appearance:none;border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:700;letter-spacing:.02em}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:11;margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;box-shadow:0 6px 20px rgb(0 0 0 / .2)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top wrap">
  <div class="brand"><i aria-hidden="true"></i>Preppdag</div>
  <div class="when" id="when"></div>
</header>
<div class="lidbar"><div class="wrap lids" id="lids" role="group" aria-label="Välj kombo"></div></div>

<main class="wrap">
  <section class="view" id="view-handla" aria-label="Inköpslista"></section>
  <section class="view" id="view-recept" aria-label="Recept" hidden></section>
  <section class="view" id="view-sotsug" aria-label="Sötsug och te" hidden></section>
  <section class="view" id="view-veckan" aria-label="Veckan" hidden></section>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<nav class="tabbar" aria-label="Flikar">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-act="tab" data-tab="handla" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h17l-1.6 9.6a2 2 0 0 1-2 1.7H7.1a2 2 0 0 1-2-1.7z"/><path d="M8 9l3.2-5M16 9l-3.2-5M9 13v3.5M15 13v3.5"/></svg>
      Handla
    </button>
    <button class="tab" role="tab" data-act="tab" data-tab="recept" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v4.5a4.5 4.5 0 0 1-4.5 4.5h-7A4.5 4.5 0 0 1 4 15.5z"/><path d="M2 11h2M20 11h2M9 7.5c0-1.2 1.2-1.3 1.2-2.5M13.8 7.5c0-1.2 1.2-1.3 1.2-2.5"/></svg>
      Recept
    </button>
    <button class="tab" role="tab" data-act="tab" data-tab="sotsug" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10h12v4.5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M16.5 11.5h1.2a2.3 2.3 0 0 1 0 4.6h-1.6M8.5 3.5v3M12.5 3.5v3"/></svg>
      Sötsug
    </button>
    <button class="tab" role="tab" data-act="tab" data-tab="veckan" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></svg>
      Veckan
    </button>
  </div>
</nav>

<script>
(function(){
'use strict';

/* ---------- Data ---------- */

const SECTIONS = [
  {id:'kott', name:'Kött & fågel'},
  {id:'gront', name:'Frukt & grönt'},

function n2s(n, half){
  const r = Math.round(n*100)/100;
  if (half) { const w = Math.floor(r); if (Math.abs(r - w - 0.5) < 1e-6) return (w ? w : '') + '½'; }
  return String(r).replace('.', ',');
}
function rng(lo, hi, half){ return lo === hi ? n2s(lo, half) : n2s(lo, half) + '–' + n2s(hi, half); }
function fmtPart(u, p){
  const lo = p[0], hi = p[1];
  if (u === 'g' && lo >= 1000) return rng(lo/1000, hi/1000) + ' kg';
  if (u === 'dl' && lo >= 10) return rng(lo/10, hi/10) + ' l';
  if (u === 'klyfta') return rng(lo, hi) + (hi > 1 ? ' klyftor' : ' klyfta');
  if (u === 'burk') return rng(lo, hi) + (hi > 1 ? ' burkar' : ' burk');
  return rng(lo, hi, u === 'st') + ' ' + u;
}
function amount(e){
  if (e.custom) return e.custom.q;
  const parts = e.units.map(u => fmtPart(u, e.parts[u]));
  if (!parts.length) return e.def.qt || '';
  return parts.join(' + ') + (e.hasNull ? ' + ' + (e.def.more || 'lite') : '');
}

function buildList(c){
  const map = new Map();
  function add(b, tag, mult){
    const k = b[0], q = b[1], u = b[2], alt = b[3];
    const def = ITEMS[k]; if (!def) return;
    let e = map.get(k);
    if (!e) { e = {k, def, parts:{}, units:[], hasNull:false, tags:[], alts:def.alt ? [def.alt] : []}; map.set(k, e); }
    if (q == null) e.hasNull = true;
    else {
      const lo = Array.isArray(q) ? q[0] : q, hi = Array.isArray(q) ? q[1] : q;
      if (!e.parts[u]) { e.parts[u] = [0,0]; e.units.push(u); }
      e.parts[u][0] += lo*mult; e.parts[u][1] += hi*mult;
    }
    if (!e.tags.includes(tag)) e.tags.push(tag);
    if (alt && !e.alts.includes(alt)) e.alts.push(alt);
  }
  COMBOS[c].dishes.forEach(id => { const d = DISHES[id]; d.ing.forEach(r => (r.b || []).forEach(b => add(b, d.tag, 1))); });
  if (S.breakfast > 0) BREAKFAST.b.forEach(b => add(b, BREAKFAST.tag, S.breakfast));
  ['kvarg','bar'].forEach(id => {
    const n = S.sweets[id] || 0;
    if (n > 0) SWEETS[id].ing.forEach(r => (r.b || []).forEach(b => add(b, SWEETS[id].tag, n)));
  });
  if (S.sweets.te) TEA.b.forEach(b => add(b, TEA.tag, 1));
  const all = [...map.values()].sort((x, y) => ITEM_ORDER.indexOf(x.k) - ITEM_ORDER.indexOf(y.k));
  // User-added items go last in the section they picked
  const own = S.custom.map(i => ({k:'u:' + i.id, def:{n:i.n, s:i.s}, custom:i, alts:[], tags:['Egen vara'].concat(i.w ? ['Varje vecka'] : [])}));
  return SECTIONS.map(sec => ({sec, items:all.filter(e => e.def.s === sec.id).concat(own.filter(e => e.def.s === sec.id))})).filter(g => g.items.length);
}

function renderWhen(){
  const el = $('#when'), now = new Date(), d = now.getDay();
  if (d === 6) { el.textContent = 'Lördag · preppdag idag'; el.classList.add('today'); return; }
  el.classList.remove('today');
  const days = (6 - d + 7) % 7;
  const nx = new Date(now.getFullYear(), now.getMonth(), now.getDate() + days);
  const f = new Intl.DateTimeFormat('sv-SE', {day:'numeric', month:'short'}).format(nx).replace('.', '');
  el.textContent = 'Preppdag lör ' + f + ' · om ' + days + (days === 1 ? ' dag' : ' dagar');
}

function updateCounts(){
  const v = $('#view-handla');
  const boxes = [...v.querySelectorAll('.item input')];
  const done = boxes.filter(b => b.checked).length, total = boxes.length, left = total - done;
  $('#left-title').textContent = left ? (left === 1 ? '1 vara kvar' : left + ' varor kvar') : 'Allt är i korgen';
  const p = $('#progress');
  p.setAttribute('aria-valuemin', '0'); p.setAttribute('aria-valuemax', String(total)); p.setAttribute('aria-valuenow', String(done));
  p.firstElementChild.style.width = (total ? done/total*100 : 0) + '%';
  v.querySelectorAll('.group').forEach(g => {
    const b = [...g.querySelectorAll('.item input')];
    g.querySelector('[data-count]').textContent = b.filter(x => x.checked).length + '/' + b.length;
  });
}

function listText(){
  const c = S.combo, groups = buildList(c), chk = new Set(S.checked[c] || []);
  let rest = groups.map(g => ({sec:g.sec, items:g.items.filter(e => e.custom ? !e.custom.done : !chk.has(e.k))})).filter(g => g.items.length);
  if (!rest.length) rest = groups;
  const n = names(c);
  const lines = ['Combo ' + c + ': ' + n[0] + ' + ' + n[1]];
  rest.forEach(g => {
    lines.push('', g.sec.name.toUpperCase());
    g.items.forEach(e => { const a = amount(e); lines.push('- ' + e.def.n + (a ? ' – ' + a : '')); });
  });
  return lines.join('\n');
}

function copyList(){
  const text = listText();
  const fallback = () => {
    const box = $('#copybox'), ta = $('#copytext');
    ta.value = text; box.hidden = false;
    ta.focus(); ta.select(); try { ta.setSelectionRange(0, text.length); } catch(e) {}
    toast('Markera och kopiera texten under knapparna');
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast('Kopierad. Klistra in i Anteckningar eller Påminnelser.'), fallback);
  } catch(e) { fallback(); }
}

let armTimer = null;
function resetChecks(btn){
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); btn.textContent = 'Tryck igen för att avbocka';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'Avbocka allt'; }, 3000);
    return;
  }
  clearTimeout(armTimer);
  S.checked[S.combo] = []; S.custom.forEach(i => { i.done = false; }); save(); renderHandla();
  toast('Listan är avbockad');
}

const AMT = /^((?:ca\s)?[\d½][\d,½–]*(?:\s(?:kg|g|ml|dl|msk|tsk|burkar|burk|klyftor|klyfta))?)\s+(.+)$/;
function ingList(rows){
  return '<ul class="ing">' + rows.map(r => {
    if (r.g) return `<li class="ing-g">${r.g}</li>`;
    const m = r.t.match(AMT);
    return m ? `<li><span class="ia">${m[1]}</span><span>${m[2]}</span></li>` : `<li><span class="ia"></span><span>${r.t}</span></li>`;
  }).join('') + '</ul>';
}

let wakeLock = null, wantWake = false;
const canWake = 'wakeLock' in navigator;
async function setWake(on){
  wantWake = on;
  if (on) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
      toast('Skärmen hålls tänd medan sidan är öppen');
    } catch(e) { wantWake = false; wakeLock = null; toast('Skärmen kan inte hållas tänd här'); }
  } else {
    try { if (wakeLock) await wakeLock.release(); } catch(e) {}
    wakeLock = null;
  }
  renderRecept();
}
document.addEventListener('visibilitychange', () => {
  if (wantWake && !wakeLock && document.visibilityState === 'visible') {
    navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
  }
});

      <div class="block">
        <button class="btn primary" type="button" data-act="next-week" style="--accent:var(--${nx.toLowerCase()})">Ny vecka: byt till Combo ${nx}</button>
        <p class="hint">Väljer ${nn[0]} + ${nn[1]} och nollställer den kombons inköpslista och receptsteg. Efter C börjar du om på A.</p>
      </div>
    </article>
    <article class="card">
      <h2 class="h3">Laktosfritt</h2>
      <p style="margin:0">Använd laktosfria produkter som kvarg, mjölk, fetaost och matlagningsgrädde, eller växtbaserade alternativ som soja-, havre- eller kokosprodukter.</p>
    </article>
  `;
}

/* ---------- Navigering ---------- */

function showTab(){
  TABS.forEach(t => { $('#view-' + t).hidden = t !== S.tab; });
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
}
function setTab(t){
  if (!TABS.includes(t)) return;
  S.tab = t; save(); showTab(); window.scrollTo(0, 0);
}
function setCombo(c){
  if (!ORDER.includes(c)) return;
  S.combo = c; save();
  document.body.dataset.combo = c;
  renderLids(); renderHandla(); renderRecept(); renderVeckan();
}

let toastTimer = null;
function toast(msg, label, fn){
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  if (label && fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    b.addEventListener('click', () => { clearTimeout(toastTimer); el.hidden = true; fn(); });
    el.append(b);
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, label ? 5000 : 2600);
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'combo') setCombo(t.dataset.c);
  else if (act === 'tab') setTab(t.dataset.tab);
  else if (act === 'dish') { S.dish[S.combo] = Number(t.dataset.i); save(); renderRecept(); }
  else if (act === 'step') {
    const id = t.dataset.d, i = Number(t.dataset.i), arr = S.steps[id] || [];
    S.steps[id] = arr.includes(i) ? arr.filter(x => x !== i) : arr.concat(i);
    save(); renderRecept();
  }
  else if (act === 'steps-reset') { delete S.steps[t.dataset.d]; save(); renderRecept(); }
  else if (act === 'sweet') {
    const k = t.dataset.k;
    S.sweets[k] = Math.max(0, Math.min(7, (S.sweets[k] || 0) + Number(t.dataset.d)));
    save(); renderHandla(); renderSotsug(); renderRecept(); renderVeckan();
  }
  else if (act === 'breakfast') {
    S.breakfast = Math.max(0, Math.min(7, (S.breakfast || 0) + Number(t.dataset.d)));
    save(); renderHandla(); renderRecept(); renderVeckan();
  }
  else if (act === 'own-del') {
    const idx = S.custom.findIndex(i => i.id === t.dataset.u);
    if (idx < 0) return;
    const [gone] = S.custom.splice(idx, 1);
    save(); renderHandla();
    toast(gone.n + ' är borttagen', 'Ångra', () => { S.custom.splice(Math.min(idx, S.custom.length), 0, gone); save(); renderHandla(); });
  }
  else if (act === 'copy') copyList();
  else if (act === 'reset') resetChecks(t);
  else if (act === 'wake') setWake(!wantWake);
  else if (act === 'goto-extras') { S.extrasOpen = true; save(); renderHandla(); setTab('handla'); }
  else if (act === 'next-week') {
    const n = next(S.combo);
    S.checked[n] = [];
    COMBOS[n].dishes.forEach(id => { delete S.steps[id]; });
    S.dish[n] = 0;
    // Bought one-off items leave the list; weekly items come back unchecked
    S.custom = S.custom.filter(i => i.w || !i.done);
    S.custom.forEach(i => { i.done = false; });
    setCombo(n); setTab('handla');
    toast('Combo ' + n + ' är vald och listan är nollställd');
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.matches('.item input') && t.dataset.u) {
    const i = S.custom.find(x => x.id === t.dataset.u);
    if (i) { i.done = t.checked; save(); updateCounts(); }
  } else if (t.matches('.item input')) {
    const c = S.combo, k = t.dataset.k, arr = S.checked[c] || [];
    S.checked[c] = t.checked ? (arr.includes(k) ? arr : arr.concat(k)) : arr.filter(x => x !== k);
    save(); updateCounts();
  } else if (t.id === 'te-toggle') {
    S.sweets.te = t.checked; save(); renderHandla(); renderRecept(); renderVeckan();
  }
});

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'add-form') return;
  ev.preventDefault();
  const name = $('#add-name').value.trim().replace(/\s+/g, ' ');
  if (!name) { $('#add-name').focus(); toast('Skriv vad du vill lägga till'); return; }
  const sec = $('#add-sec').value;
  const item = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    n: name.slice(0, 60), q: $('#add-qty').value.trim().slice(0, 20),
    s: SECTIONS.some(x => x.id === sec) ? sec : 'ovrigt', w: $('#add-weekly').checked, done: false
  };
  S.custom.push(item); S.addSec = item.s; S.addOpen = true; save();
  renderHandla();
  $('#add-name').focus();
  toast(item.n + ' ligger nu i listan');
});

/* ---------- Start ---------- */
document.body.dataset.combo = S.combo;
renderWhen(); renderLids(); renderHandla(); renderRecept(); renderSotsug(); renderVeckan(); showTab();
})();
</script>
